<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Crypto Bot Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <style>
      :root {
        --bg-primary: #0d1117;
        --bg-secondary: #161b22;
        --bg-tertiary: #1c2128;
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #e1e8ff;
        --text-secondary: #8b949e;
        --accent-green: #58D68D;
        --accent-red: #ff5e57;
        --accent-blue: #539bf5;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
      }
      
      /* Navigation */
      nav {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 0;
      }
      
      nav .container {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
      }
      
      nav .logo {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
        text-decoration: none;
        padding: 1rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      nav .logo::before {
        content: "📈";
        font-size: 1.5rem;
      }
      
      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 0.25rem;
      }
      
      nav a {
        color: var(--text-secondary);
        text-decoration: none;
        padding: 1rem 1rem;
        display: block;
        transition: all 0.2s;
        border-bottom: 2px solid transparent;
      }
      
      nav a:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.04);
      }
      
      nav a.active {
        color: var(--text-primary);
        border-bottom-color: var(--accent-blue);
      }
      
      /* Main Content */
      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      
      h1 {
        font-size: 2rem;
        margin: 0 0 1.5rem 0;
        font-weight: 600;
      }
      
      h2 {
        font-size: 1.5rem;
        margin: 1.5rem 0 1rem 0;
        font-weight: 600;
      }
      
      /* Cards */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      
      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
        padding: 1.25rem;
      }
      
      .card h3 {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin: 0 0 0.5rem 0;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      
      .card .value {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0;
      }
      
      .card .detail {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin: 0.5rem 0 0 0;
      }
      
      /* Buttons */
      button, .btn {
        padding: 0.625rem 1.25rem;
        background: var(--accent-blue);
        border: none;
        border-radius: 0.5rem;
        color: white;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
        display: inline-block;
        text-decoration: none;
      }
      
      button:hover, .btn:hover {
        opacity: 0.85;
        transform: translateY(-1px);
      }
      
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      
      button.secondary {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
      }
      
      button.success {
        background: var(--accent-green);
        color: #000;
      }
      
      button.danger {
        background: var(--accent-red);
      }
      
      /* Status indicators */
      .status {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      
      .status.bullish, .status.success {
        background: rgba(88, 214, 141, 0.2);
        color: var(--accent-green);
      }
      
      .status.bearish, .status.danger {
        background: rgba(255, 94, 87, 0.2);
        color: var(--accent-red);
      }
      
      .status.neutral, .status.info {
        background: rgba(83, 155, 245, 0.2);
        color: var(--accent-blue);
      }
      
      /* Form elements */
      .form-group {
        margin-bottom: 1.5rem;
      }
      
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
      }
      
      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 0.625rem;
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        color: var(--text-primary);
        font-size: 0.875rem;
      }
      
      input[type="checkbox"] {
        width: 1rem;
        height: 1rem;
        cursor: pointer;
      }
      
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      .checkbox-group label {
        margin: 0;
        cursor: pointer;
      }
      
      /* Loading spinner */
      .spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Utility classes */
      .text-success { color: var(--accent-green); }
      .text-danger { color: var(--accent-red); }
      .text-muted { color: var(--text-secondary); }
      .mt-2 { margin-top: 1rem; }
      .mb-2 { margin-bottom: 1rem; }
      .flex { display: flex; }
      .gap-1 { gap: 0.5rem; }
      .items-center { align-items: center; }
      
      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    <nav>
      <div class="container">
        <a href="/ui" class="logo">Trading Bot</a>
        <ul>
          <li><a href="/ui" class="{% if request.path == '/ui' %}active{% endif %}">Dashboard</a></li>
          <li><a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">Settings</a></li>
          <li><a href="/backtest" class="{% if request.path == '/backtest' %}active{% endif %}">Backtest</a></li>
          <li><a href="/api/stats" class="{% if request.path == '/api/stats' %}active{% endif %}">API</a></li>
        </ul>
      </div>
    </nav>
    
    <main>
      {% block content %}{% endblock %}
    </main>
    
    {% block scripts %}{% endblock %}
  </body>
</html>
