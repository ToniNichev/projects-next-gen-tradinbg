<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crypto Bot Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        background: #0d1117;
        color: #e1e8ff;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .card {
        flex: 1;
        min-width: 200px;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .chart-container {
        position: relative;
        height: 400px;
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-top: 1rem;
      }
      .chart-controls {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        justify-content: flex-end;
      }
      .chart-controls button {
        padding: 0.5rem 1rem;
        background: rgba(88, 214, 141, 0.2);
        border: 1px solid rgba(88, 214, 141, 0.4);
        border-radius: 0.5rem;
        color: #58D68D;
        cursor: pointer;
        font-size: 0.875rem;
        transition: all 0.2s;
      }
      .chart-controls button:hover {
        background: rgba(88, 214, 141, 0.3);
        border-color: rgba(88, 214, 141, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Crypto Bot Chart</h1>
      <div class="summary">
        <div class="card">
          <p>Last signal</p>
          <h2 id="signal-text">--</h2>
          <p id="signal-detail"></p>
        </div>
        <div class="card">
          <p>Last trade</p>
          <h2 id="trade-text">--</h2>
          <p id="trade-detail"></p>
        </div>
      </div>
      <div class="chart-container">
        <div class="chart-controls">
          <button onclick="resetZoom()">Reset Zoom</button>
          <button onclick="zoomIn()">Zoom In (+)</button>
          <button onclick="zoomOut()">Zoom Out (-)</button>
        </div>
        <canvas id="priceChart"></canvas>
      </div>
    </main>
    <script>
      console.log("Chart.js version:", Chart.version);
      console.log("Available chart types:", Object.keys(Chart.registry.controllers.items));
      
      const ctx = document.getElementById("priceChart").getContext("2d");
      const chart = new Chart(ctx, {
        type: "candlestick",
        data: {
          datasets: [
            {
              label: "BTC/USDT",
              data: [],
              color: {
                up: "#58D68D",
                down: "#ff5e57",
                unchanged: "#999",
              },
              borderColor: {
                up: "#58D68D",
                down: "#ff5e57",
                unchanged: "#999",
              },
              barPercentage: 0.9,
              categoryPercentage: 1.0,
            },
          ],
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              type: "time",
              time: {
                unit: "minute",
                displayFormats: {
                  minute: "MMM dd HH:mm",
                },
                tooltipFormat: "MMM dd HH:mm",
              },
              ticks: {
                color: "#e1e8ff",
                source: "auto",
                autoSkip: true,
                maxRotation: 0,
              },
              grid: {
                color: "rgba(255,255,255,0.1)",
              },
              offset: true,
            },
            y: {
              beginAtZero: false,
              type: "linear",
              ticks: {
                color: "#e1e8ff",
              },
              grid: {
                color: "rgba(255,255,255,0.1)",
              },
            },
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                color: "#e1e8ff",
              },
            },
            zoom: {
              pan: {
                enabled: true,
                mode: 'xy',
                modifierKey: 'shift',
              },
              zoom: {
                wheel: {
                  enabled: true,
                  speed: 0.1,
                },
                pinch: {
                  enabled: true,
                },
                mode: 'xy',
              },
              limits: {
                x: { minRange: 60 * 1000 }, // Minimum 1 minute
                y: { minRange: 0.01 }, // Minimum price range
              },
            },
          },
        },
      });

      async function refresh() {
        try {
          const resp = await fetch("/history");
          const body = await resp.json();
          const history = body.history || [];
          console.log("History data:", history);
          
          const candleData = history.map((row) => ({
            x: new Date(row.timestamp).getTime(),
            o: row.open ?? row.price,
            h: row.high ?? row.price,
            l: row.low ?? row.price,
            c: row.close ?? row.price,
          }));
          
          console.log("Candlestick data:", candleData);
          console.log("First candle:", candleData[0]);
          console.log("Data length:", candleData.length);
          
          chart.data.datasets[0].data = candleData;
          
          // Calculate Y scale range from data
          let minPrice = Infinity;
          let maxPrice = -Infinity;
          candleData.forEach(candle => {
            minPrice = Math.min(minPrice, candle.l);
            maxPrice = Math.max(maxPrice, candle.h);
          });
          
          if (minPrice !== Infinity && maxPrice !== -Infinity) {
            const padding = (maxPrice - minPrice) * 0.1 || maxPrice * 0.01;
            chart.options.scales.y.min = minPrice - padding;
            chart.options.scales.y.max = maxPrice + padding;
            console.log("Setting Y scale:", chart.options.scales.y.min, "to", chart.options.scales.y.max);
          }
          
          // If only one data point, adjust time scale bounds for visibility
          if (candleData.length === 1) {
            const timestamp = candleData[0].x;
            const hourInMs = 60 * 60 * 1000;
            chart.options.scales.x.min = timestamp - hourInMs;
            chart.options.scales.x.max = timestamp + hourInMs;
          } else {
            chart.options.scales.x.min = undefined;
            chart.options.scales.x.max = undefined;
          }
          
          // Add signals dataset if not exists
          if (!chart.data.datasets[1]) {
            chart.data.datasets.push({
              label: "Signals",
              type: "scatter",
              pointStyle: "triangle",
              pointRadius: 8,
              data: [],
              showLine: false,
              yAxisID: "y",
            });
          }
          
          chart.data.datasets[1].data = history
            .filter((row) => row.signal_direction !== "neutral")
            .map((row) => ({
              x: new Date(row.timestamp).getTime(),
              y: row.price,
              backgroundColor:
                row.signal_direction === "bullish" ? "#33ff8a" : "#ff5e57",
            }));
          
          console.log("Calling chart.update()...");
          chart.update();
          console.log("Chart updated successfully");
          console.log("Chart scales:", chart.scales);
          console.log("Canvas dimensions:", ctx.canvas.width, "x", ctx.canvas.height);
          console.log("X scale range:", chart.scales.x.min, "to", chart.scales.x.max);
          console.log("Y scale range:", chart.scales.y.min, "to", chart.scales.y.max);
          console.log("Chart data:", chart.data);
          
          const lastSignalFromHistory = history[history.length - 1];
          const lastSignal = lastSignalFromHistory || body.last_signal;
          if (lastSignal) {
            document.getElementById("signal-text").textContent =
              lastSignal.signal_direction.toUpperCase();
            document.getElementById(
              "signal-detail"
            ).textContent = `${new Date(lastSignal.timestamp).toLocaleTimeString()} · price ${lastSignal.price.toFixed(
              2
            )}`;
          }
          const lastTrade = body.last_trade;
          if (lastTrade) {
            document.getElementById("trade-text").textContent =
              lastTrade.side.toUpperCase();
            document.getElementById(
              "trade-detail"
            ).textContent = `${lastTrade.timestamp} · ${lastTrade.usdt_balance.toFixed(
              2
            )} USDT`;
          }
        } catch (err) {
          console.error("Error refreshing chart:", err);
        }
      }

      function resetZoom() {
        chart.resetZoom();
      }
      
      function zoomIn() {
        chart.zoom(1.2);
      }
      
      function zoomOut() {
        chart.zoom(0.8);
      }

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
